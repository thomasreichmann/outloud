name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Besides the latest: Windows build 20348, the oldest Windows here
        # and the first that can leave Outloud's own sound out of a capture;
        # an Intel Mac; and the oldest macOS here, 14 (Go needs 13).
        os: [ubuntu-latest, windows-latest, windows-2022, macos-latest, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Show what the Mac's capture finds
        if: runner.os == 'macOS'
        run: go test -v -run 'TestLoad|TestOutput' ./internal/coreaudio/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for the version from git describe
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet every target
        run: |
          for target in windows/amd64 darwin/arm64 darwin/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go vet ./...
          done
      - run: ./build.sh release
      - uses: actions/upload-artifact@v7
        with:
          name: outloud
          path: dist/release/
